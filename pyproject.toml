[project]
name = "todo-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Kumar", email = "rahul.kumar@excodelabs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_scheme = "pep440"
update_changelog_on_bump = false

[project.scripts]
todo-agent = "todo_agent:main"

[tool.poe.tasks]
dev = "uvicorn todo_agent.main:app --reload"
start = "uvicorn todo_agent.main:app"
test = "pytest"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check . --fix"
typecheck = "mypy ."
audit = "pip-audit"

[tool.poe.tasks.check]
sequence = [
    "lint",
    "format-check",
    "typecheck",
    "test",
    "audit",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
